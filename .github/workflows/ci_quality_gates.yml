name: SchemaSentinel Production CI Quality Gates

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality_gates:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyyaml

      - name: Gate 1 - Zero-Comment Compliance Audit
        run: |
          python -c '
          import os, sys, re
          comment_re = re.compile(r"^\s*#")
          violations = []
          for root in ["src", "tests"]:
              for dirpath, _, filenames in os.walk(root):
                  for f in filenames:
                      if f.endswith(".py"):
                          p = os.path.join(dirpath, f)
                          with open(p, "r", encoding="utf-8") as fh:
                              for idx, line in enumerate(fh, 1):
                                  if comment_re.match(line):
                                      violations.append(f"{p}:{idx} - {line.strip()}")
          if violations:
              print(f"Zero-comment policy violation detected ({len(violations)} occurrences):")
              for v in violations[:10]:
                  print(f"  {v}")
              sys.exit(1)
          print("Gate 1 Passed: Zero-comment compliance certified across all Python source files.")
          '

      - name: Gate 2 - Python AST Compilation Integrity
        run: |
          python -m compileall src tests

      - name: Gate 3 - Data Engine & Policy AST Regressions
        run: |
          python -m pytest tests/test_schema_parser.py tests/test_policy_ast.py tests/test_grammar.py tests/test_constrained_logits.py -v

      - name: Gate 4 - Execution Sandbox & Local Serving Verification
        run: |
          python -m pytest tests/test_runner.py tests/test_equivalence.py tests/test_red_team.py tests/test_local_runner.py -v

      - name: Gate 5 - LLMOps Telemetry & Drift Monitoring Gates
        run: |
          python -m pytest tests/test_tracker.py tests/test_drift_monitor.py -v

      - name: Gate 6 - Hardware Envelope & Model Binary Quarantine
        run: |
          python -c '
          import os, sys
          max_bytes = 50 * 1024 * 1024
          offenders = []
          for root, _, files in os.walk("."):
              if ".git" in root:
                  continue
              for f in files:
                  p = os.path.join(root, f)
                  try:
                      size = os.path.getsize(p)
                      if size > max_bytes:
                          offenders.append(f"{p} ({size / (1024**2):.1f} MB)")
                  except OSError:
                      pass
          if offenders:
              print("Large binary files detected violating local host boundary:")
              for o in offenders:
                  print(f"  {o}")
              sys.exit(1)
          print("Gate 6 Passed: Zero heavy model weight binaries committed to local git tree.")
          '
